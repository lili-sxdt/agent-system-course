    <rect x="150" y="140" width="180" height="54" rx="10" fill="#ffffff"/>
    <rect x="360" y="140" width="180" height="54" rx="10" fill="#ffffff"/>
    <rect x="570" y="140" width="180" height="54" rx="10" fill="#ffffff"/>
    <rect x="360" y="238" width="180" height="54" rx="10" fill="#ffffff"/>
    <rect x="360" y="318" width="180" height="54" rx="10" fill="#ffffff"/>
    <rect x="360" y="398" width="180" height="54" rx="10" fill="#ffffff"/>
    <rect x="630" y="318" width="180" height="54" rx="10" fill="#ffffff"/>
