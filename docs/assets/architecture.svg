<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" font-family="system-ui,'Microsoft YaHei',sans-serif" role="img" aria-label="mini-harness 系统架构">
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc" rx="12"/>
